[project]
name = "flaketriage"
version = "0.1.0"
description = "Pull failing GitHub Actions jobs, work out which failures are flakes, and categorise why"
requires-python = ">=3.11"

# No runtime dependencies on purpose. urllib, sqlite3 and http.server cover all of it, and a tool
# maintainers are meant to try should not start with a dependency tree.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
flaketriage = "flaketriage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["flaketriage*"]

[tool.setuptools.package-data]
flaketriage = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
